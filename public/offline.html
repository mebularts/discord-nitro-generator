<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SolveClone Offline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #020617; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
        .card { background: rgba(15, 23, 42, 0.85); border: 1px solid #1e293b; border-radius: 1.5rem; padding: 2rem; text-align: center; max-width: 22rem; }
    </style>
</head>
<body>
<div class="card">
    <div style="font-size:3rem">🔌</div>
    <h1 class="h4 mt-3">You are offline</h1>
    <p class="text-secondary">Reconnect to load new puzzles. Any saved riddles remain available when the app is installed.</p>
    <a href="/" class="btn btn-primary mt-3">Try again</a>
</div>
</body>
</html>
